<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { createContext } from '/src/engine/context.js';
import { loadCharacterKit, createCharacter } from '/src/characters/index.js';
const ctx = createContext(document.getElementById('c'), { quality: 'high' });
const kit = await loadCharacterKit(ctx);
const q = new URLSearchParams(location.search);
const outfits = (q.get('o') || 'shirt-trousers,ankara-gown').split(',');
const state = q.get('s') || 'idle';
const chars = [];
outfits.forEach((o, i) => {
  const [outfit, body, hw] = o.split(':');
  const skin = q.get('skin') ? +q.get('skin').split(',')[i % q.get('skin').split(',').length] : (i * 2) % 6;
  const c = createCharacter(kit, { body: body || (i % 2 ? 'female' : 'male'), outfit, skin, headwear: hw || 'none' }, { detail: q.get('d') || 'high' });
  c.object.position.x = (i - (outfits.length - 1) / 2) * (+(q.get('sp') || 0.9));
  c.play(state);
  ctx.scene.add(c.object);
  chars.push(c);
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#9a8a70' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; ctx.scene.add(ground);
const cy = +(q.get('cy') || 1.0), cd = +(q.get('cd') || 3.4), ca = +(q.get('ca') || 0);
ctx.camera.position.set(Math.sin(ca) * cd, cy + 0.25, Math.cos(ca) * cd); ctx.camera.lookAt(0, cy, 0);
ctx.onUpdate((dt) => chars.forEach(c => c.update(dt)));
ctx.start();
setTimeout(() => { window.__ready = true; }, 200);
window.__chars = chars;
window.__ctx = ctx;
</script></body></html>
