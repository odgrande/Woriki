<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Controls harness — Amen City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fffdf7; font-family: Inter, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    .dbg {
      position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); z-index: 30;
      min-width: 170px; max-width: 46vw; padding: 8px 10px; border: 2px solid #000; border-radius: 12px;
      background: rgba(255, 253, 247, .92); box-shadow: 4px 4px 0 #000; font: 600 11.5px/1.45 Inter, system-ui, sans-serif; color: #18181b;
      pointer-events: auto;
    }
    .dbg h1 { margin: 0 0 4px; font: 700 13px "Space Grotesk", Inter, sans-serif; display: flex; gap: 6px; align-items: center; }
    .dbg h1 b { display: inline-block; padding: 0 7px; border: 2px solid #000; border-radius: 9999px; background: #86efac; font-size: 11px; }
    .dbg .row { display: flex; justify-content: space-between; gap: 10px; }
    .dbg .row span:first-child { color: #52525b; font-weight: 500; }
    .dbg .log { margin-top: 4px; padding-top: 4px; border-top: 1.5px dashed #d4d4d8; color: #3f3f46; font-weight: 500; white-space: pre; overflow: hidden; max-height: 7.5em; }
    .dbg button { margin-top: 6px; min-height: 32px; padding: 0 10px; border: 2px solid #000; border-radius: 9999px; background: #fde047; box-shadow: 2px 2px 0 #000; font: 700 11px "Space Grotesk", sans-serif; cursor: pointer; }
    .dbg.is-min .body { display: none; }
    .help {
      position: fixed; right: 12px; top: 12px; z-index: 30; width: 250px; padding: 10px 12px; border: 2px solid #000; border-radius: 12px;
      background: #fff; box-shadow: 4px 4px 0 #000; font: 500 12px/1.4 Inter, sans-serif; pointer-events: auto;
    }
    .help h2 { margin: 0 0 6px; font: 700 14px "Space Grotesk", sans-serif; }
    .help table { width: 100%; border-collapse: collapse; }
    .help td { padding: 3px 2px; border-bottom: 1.5px dashed #d4d4d8; }
    .help kbd { display: inline-block; min-width: 18px; padding: 0 5px; border: 2px solid #000; border-radius: 6px; background: #fffdf7; box-shadow: 1px 1px 0 #000; font: 700 10.5px "Space Grotesk", sans-serif; text-align: center; }
    .help[hidden] { display: none; }
    .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 31; padding: 6px 14px; border: 2px solid #000; border-radius: 9999px; background: #fde047; box-shadow: 2px 2px 0 #000; font: 700 12.5px "Space Grotesk", sans-serif; transition: opacity .3s; pointer-events: none; }
    @media (pointer: coarse) { .help { display: none; } }
  </style>
</head>
<body>
  <canvas id="world" aria-label="3D view"></canvas>
  <div id="ui"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
