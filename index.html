<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fffdf7">
  <title>Amen City</title>
  <meta name="description" content="A 3D church community in real Lagos. Pick your role, worship, pray, serve and chat with real people.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="world" aria-label="3D view"></canvas>
  <div id="boot" class="boot" role="status" aria-label="Loading Amen City">
    <div class="boot-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="84" height="84"><rect x="3" y="3" width="58" height="58" rx="16" fill="#facc15" stroke="#000" stroke-width="3"/><path d="M32 12v10M27 17h10" stroke="#000" stroke-width="3.5" stroke-linecap="round"/><path d="M17 50V33l15-10 15 10v17z" fill="#1e3a8a" stroke="#000" stroke-width="3" stroke-linejoin="round"/><path d="M28 50v-8a4 4 0 0 1 8 0v8" fill="#fffdf7" stroke="#000" stroke-width="3"/></svg>
    </div>
    <h1 class="boot-name">Amen City</h1>
    <p class="boot-tag">Lagos · Faith · Community</p>
    <div class="boot-bar"><i></i></div>
  </div>
  <style>
    .boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fffdf7;background-image:radial-gradient(circle at 50% 42%,#fff7cc 0,#fffdf7 55%);font-family:Inter,system-ui,sans-serif;transition:opacity .5s ease}
    .boot.is-done{opacity:0;pointer-events:none}
    .boot-logo{animation:boot-pop .9s cubic-bezier(.2,1.4,.4,1) both}
    .boot-name{margin:8px 0 0;font:700 34px/1 "Space Grotesk",Inter,system-ui,sans-serif;color:#18181b;letter-spacing:-.02em}
    .boot-tag{margin:0;color:#52525b;font-size:14px}
    .boot-bar{margin-top:18px;width:180px;height:10px;border:2px solid #000;border-radius:99px;overflow:hidden;background:#f4f4f5}
    .boot-bar i{display:block;height:100%;width:30%;background:#facc15;border-radius:99px;animation:boot-run 1.2s ease-in-out infinite}
    @keyframes boot-pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
    @keyframes boot-run{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
    @media (prefers-reduced-motion:reduce){.boot-logo,.boot-bar i{animation:none}}
  </style>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
