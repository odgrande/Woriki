<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfe6f7">
  <title>Pastor Life</title>
  <meta name="description" content="A virtual Christian journey: from new convert to Bible school to pastor. Grow your church from a living room to a Camp Ground.">
  <meta property="og:title" content="Pastor Life">
  <meta property="og:description" content="Get baptized, pass Bible school, get ordained, and grow your church to branches abroad. Can you stay faithful?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world" aria-label="3D view of your room or church"></canvas>

  <!-- Start screen -->
  <section id="start" class="screen">
    <div class="brand">
      <div class="logo-mark"><i data-lucide="church" aria-hidden="true"></i></div>
      <h1>Pastor Life</h1>
      <p class="tagline">Live your faith story.</p>
    </div>
    <div class="start-card">
      <label>Your name
        <input id="in-name" maxlength="20" placeholder="e.g. Tunde" autocomplete="off">
      </label>
      <label>The church you will one day plant
        <input id="in-church" maxlength="36" placeholder="e.g. Grace Assembly" autocomplete="off">
      </label>
      <label>Church tradition
        <select id="in-ctype"></select>
      </label>
      <button id="btn-start" class="btn primary big">New life</button>
      <button id="btn-continue" class="btn outline big hidden">Continue saved life</button>
      <p class="disclaimer">A virtual walk of faith. All people and churches are fictional. Scripture from the King James Version.</p>
    </div>
  </section>

  <!-- Calling reveal -->
  <section id="reveal" class="screen hidden">
    <div class="brand">
      <div class="logo" id="reveal-emoji">🎲</div>
      <h2 id="reveal-title">Rolling...</h2>
    </div>
    <div class="start-card">
      <p id="reveal-text"></p>
      <button id="btn-begin" class="btn primary big hidden">Begin</button>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="screen hidden">
    <header class="hud" aria-label="Your status">
      <div class="hud-top">
        <div class="who">
          <div class="church-name" id="hud-church"></div>
          <div class="badges"><span class="pastor-title" id="hud-title"></span><span class="badge-repent hidden" id="hud-repent"><i data-lucide="droplet" aria-hidden="true"></i>Needs repentance</span></div>
        </div>
        <div class="day-pill"><i data-lucide="calendar-days" aria-hidden="true"></i><span id="hud-day"></span></div>
      </div>
      <div class="energy" title="Energy">
        <i data-lucide="zap" aria-hidden="true"></i>
        <div class="meter" role="progressbar" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" id="hud-energy-meter"><div id="hud-energy-bar"></div></div>
        <span id="hud-energy"></span>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="k"><i data-lucide="wallet" aria-hidden="true"></i>Funds</span>
          <span class="v" id="hud-funds"></span>
        </div>
        <div class="stat">
          <span class="k"><i data-lucide="heart-handshake" aria-hidden="true"></i>Faith</span>
          <span class="v" id="hud-faith"></span>
          <div class="meter sm"><div id="meter-faith"></div></div>
        </div>
        <div class="stat">
          <span class="k"><i data-lucide="shield-check" aria-hidden="true"></i>Character</span>
          <span class="v" id="hud-character"></span>
          <div class="meter sm"><div id="meter-character"></div></div>
        </div>
        <div class="stat">
          <span class="k when-pre"><i data-lucide="book-open" aria-hidden="true"></i>Word</span>
          <span class="k when-pastor"><i data-lucide="megaphone" aria-hidden="true"></i>Fame</span>
          <span class="v" id="hud-word"></span>
          <div class="meter sm"><div id="meter-word"></div></div>
        </div>
        <div class="stat">
          <span class="k when-pre"><i data-lucide="calendar-check" aria-hidden="true"></i>Services</span>
          <span class="k when-pastor"><i data-lucide="users" aria-hidden="true"></i>Members</span>
          <span class="v" id="hud-members"></span>
        </div>
        <div class="stat">
          <span class="k when-pre"><i data-lucide="briefcase" aria-hidden="true"></i>Job</span>
          <span class="k when-pastor"><i data-lucide="building-2" aria-hidden="true"></i>Venue</span>
          <span class="v" id="hud-venue"></span>
        </div>
      </div>
    </header>

    <nav class="nav" aria-label="Main">
      <div class="nav-brand"><span class="logo-mark sm"><i data-lucide="church" aria-hidden="true"></i></span>Pastor Life</div>
      <button class="nav-item active" data-tab="ministry" aria-current="page"><i data-lucide="sparkles" aria-hidden="true"></i><span>Ministry</span></button>
      <button class="nav-item hidden" id="tab-btn-build" data-tab="build"><i data-lucide="church" aria-hidden="true"></i><span>Church</span></button>
      <button class="nav-item nav-end" id="btn-endday"><i data-lucide="moon" aria-hidden="true"></i><span>End day</span></button>
      <button class="nav-item" data-tab="log"><i data-lucide="notebook-pen" aria-hidden="true"></i><span>Diary</span></button>
      <button class="nav-item" id="btn-share"><i data-lucide="share-2" aria-hidden="true"></i><span>Share</span></button>
    </nav>

    <div class="panel">
      <p class="verse"><i data-lucide="quote" aria-hidden="true"></i><span id="verse"></span></p>
      <main>
        <div id="tab-ministry" class="tab-body"></div>
        <div id="tab-build" class="tab-body hidden"></div>
        <div id="tab-log" class="tab-body hidden"><ul id="log"></ul></div>
      </main>
    </div>
  </section>

  <!-- Modal for events / endings -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji"></div>
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <div id="modal-choices" class="choices"></div>
    </div>
  </div>

  <!-- Share sheet -->
  <div id="share" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>Share your testimony</h3>
      <canvas id="share-canvas" width="1080" height="1080"></canvas>
      <div class="choices">
        <button id="btn-share-native" class="btn primary"><i data-lucide="share-2" aria-hidden="true"></i>Share image</button>
        <a id="btn-share-wa" class="btn wa" target="_blank" rel="noopener">WhatsApp</a>
        <a id="btn-share-x" class="btn outline" target="_blank" rel="noopener">Post on X</a>
        <button id="btn-share-dl" class="btn outline"><i data-lucide="download" aria-hidden="true"></i>Download</button>
        <button id="btn-share-close" class="btn ghost">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <script src="scene.js"></script>
  <script src="game.js"></script>
</body>
</html>
